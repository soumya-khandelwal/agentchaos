<template>
    <lightning-card title="Agentforce Safety Studio" icon-name="standard:bot">
        <!-- Top Status Pill -->
        <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
            <span class="slds-badge slds-theme_success slds-m-right_small font-bold">
                ✓ Free Offline Mode (0 Credits)
            </span>
        </div>

        <div class="slds-p-around_medium">
            <!-- In-Page Visual Alert Notification -->
            <template if:true={bannerMessage}>
                <div class={bannerClass} role="status">
                    <span class="slds-assistive-text">{bannerType}</span>
                    <div class="slds-notify__content">
                        <h2 class="slds-text-heading_small font-bold">{bannerMessage}</h2>
                    </div>
                </div>
            </template>

            <!-- Main Tabset (3 clearly distinct tabs) -->
            <lightning-tabset variant="scoped">
                
                <!-- TAB 1: ACTION SAFETY TEST -->
                <lightning-tab label="1. Test an Action" icon-name="utility:shield">
                    <!-- Action Selector Bar -->
                    <div class="slds-box slds-theme_shade slds-m-bottom_medium slds-m-top_x-small">
                        <div class="slds-grid slds-gutters slds-grid_vertical-align-end">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
                                <lightning-combobox
                                    name="targetAction"
                                    label="Select an Action to Test"
                                    value={selectedAction}
                                    options={actionOptions}
                                    onchange={handleActionChange}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-text-align_right">
                                <lightning-button
                                    variant="brand"
                                    label="⚡ Run Safety Test"
                                    icon-name="utility:play"
                                    onclick={handleRunAudit}
                                    disabled={isLoading}>
                                </lightning-button>
                            </div>
                        </div>
                    </div>

                    <!-- Progress Bar when running -->
                    <template if:true={isLoading}>
                        <div class="slds-box slds-theme_info slds-m-bottom_medium slds-p-around_medium">
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                <lightning-icon icon-name="utility:spinner" size="small" class="slds-m-right_small"></lightning-icon>
                                <span class="slds-text-heading_small font-bold">{currentTestStepText}</span>
                            </div>
                            <lightning-progress-bar value={testProgressPercent} size="medium" variant="circular"></lightning-progress-bar>
                        </div>
                    </template>

                    <!-- Simple Summary Result Banner -->
                    <template if:true={report}>
                        <div class="slds-box slds-m-bottom_medium slds-theme_default slds-p-around_medium result-summary-box">
                            <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                                <div class="slds-col slds-grow">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <template if:true={report.passed}>
                                            <span class="status-icon slds-m-right_small">✅</span>
                                            <div>
                                                <div class="slds-text-heading_medium font-bold slds-text-color_success">
                                                    All {report.totalVectors} Safety Checks Passed
                                                </div>
                                                <div class="slds-text-body_regular slds-text-color_weak">
                                                    Action <b>{report.actionName}</b> handled all failure scenarios safely. Ready for use.
                                                </div>
                                            </div>
                                        </template>
                                        <template if:false={report.passed}>
                                            <span class="status-icon slds-m-right_small">⚠️</span>
                                            <div>
                                                <div class="slds-text-heading_medium font-bold slds-text-color_error">
                                                    Issues Detected ({report.failedVectors} checks failed)
                                                </div>
                                                <div class="slds-text-body_regular slds-text-color_weak">
                                                    Action <b>{report.actionName}</b> requires safety fixes before production deployment.
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <div class="slds-col slds-no-flex slds-text-align_right">
                                    <span class="slds-badge slds-badge_lightest font-bold">Completed in {report.totalDurationMs} ms</span>
                                </div>
                            </div>
                        </div>

                        <!-- Clean 6-Check Cards Grid -->
                        <div class="slds-m-bottom_medium">
                            <div class="slds-grid slds-wrap slds-gutters">
                                <template for:each={report.results} for:item="vec">
                                    <div key={vec.id} class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                        <div class="clean-check-card slds-box slds-box_small slds-theme_default">
                                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                                <div class="slds-col slds-grow">
                                                    <span class="font-bold check-title">{vec.name}</span>
                                                </div>
                                                <div class="slds-col slds-no-flex">
                                                    <template if:true={vec.passed}>
                                                        <span class="slds-badge slds-theme_success font-bold">PASS</span>
                                                    </template>
                                                    <template if:false={vec.passed}>
                                                        <span class="slds-badge slds-theme_error font-bold">FAIL</span>
                                                    </template>
                                                </div>
                                            </div>
                                            <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                {vec.details}
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Optional Collapsed Developer Logs -->
                        <div class="slds-m-top_small slds-p-top_small slds-border_top">
                            <lightning-button
                                variant="base"
                                label={logToggleLabel}
                                icon-name={logToggleIcon}
                                onclick={handleToggleLogs}
                                class="slds-m-bottom_x-small">
                            </lightning-button>

                            <template if:true={showTechnicalLogs}>
                                <div class="terminal-box slds-m-top_x-small">
                                    <template for:each={auditLogs} for:item="log">
                                        <div key={log.id} class="terminal-line">{log.text}</div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </lightning-tab>

                <!-- TAB 2: AGENT SIMULATOR -->
                <lightning-tab label="2. Live Agent Simulator" icon-name="standard:service_crew_member">
                    <div class="slds-m-top_small slds-m-bottom_medium">
                        <!-- Quick Scenario Buttons -->
                        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                            <div class="slds-text-title_bold slds-m-bottom_x-small">
                                💡 Try a Scenario (Click a button to test how the agent reacts):
                            </div>
                            <lightning-button-group>
                                <lightning-button label="📦 Normal Support Request" onclick={handlePresetNormal}></lightning-button>
                                <lightning-button label="⚡ Test Runaway Loop" onclick={handlePresetLoop}></lightning-button>
                                <lightning-button label="❓ Missing Required Info" onclick={handlePresetDml}></lightning-button>
                            </lightning-button-group>
                        </div>

                        <!-- Chat Message Input -->
                        <div class="slds-box slds-theme_default slds-m-bottom_medium">
                            <div class="slds-grid slds-gutters slds-grid_vertical-align-end">
                                <div class="slds-col slds-grow">
                                    <lightning-input
                                        type="text"
                                        label="Customer Message"
                                        value={chatPrompt}
                                        onchange={handleChatPromptChange}
                                        placeholder="Type a message or click a scenario above...">
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-no-flex">
                                    <lightning-button
                                        variant="brand"
                                        label="Send"
                                        icon-name="utility:send"
                                        onclick={handleSendTurn}
                                        disabled={isLoading}>
                                    </lightning-button>
                                </div>
                            </div>
                        </div>

                        <!-- Live Conversation Feed -->
                        <div class="slds-m-top_medium">
                            <h3 class="slds-text-title_bold slds-m-bottom_small">Chat History</h3>

                            <template for:each={conversationHistory} for:item="turn">
                                <div key={turn.id} class="chat-row slds-m-bottom_medium">
                                    <!-- User Bubble -->
                                    <div class="chat-bubble-container slds-grid slds-grid_align-end slds-m-bottom_x-small">
                                        <div class="chat-bubble user-bubble">
                                            <div class="sender-label font-bold">You (Customer)</div>
                                            <div>{turn.userQuery}</div>
                                        </div>
                                    </div>

                                    <!-- Agent Bubble -->
                                    <div class="chat-bubble-container slds-grid slds-grid_align-start">
                                        <div class="chat-bubble agent-bubble">
                                            <div class="sender-label font-bold slds-text-color_success">Support Agent (AI)</div>
                                            <div>{turn.agentResponse}</div>

                                            <div class="safety-footer slds-m-top_x-small slds-grid slds-grid_vertical-align-center slds-wrap">
                                                <span class="slds-badge slds-badge_lightest slds-m-right_x-small">
                                                    Action: <b>{turn.actionCalled}</b>
                                                </span>
                                                <template if:true={turn.isEscalatedToHuman}>
                                                    <span class="slds-badge slds-theme_warning font-bold slds-m-right_x-small">
                                                        👤 Escalated to Human Agent
                                                    </span>
                                                </template>
                                                <span class="slds-text-body_small slds-text-color_weak">
                                                    Response Time: {turn.durationSeconds}s
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </lightning-tab>

                <!-- TAB 3: SAFETY RULES & GUARDS -->
                <lightning-tab label="3. Safety Rules" icon-name="utility:rules">
                    <div class="slds-m-top_small">
                        <div class="slds-m-bottom_medium">
                            <h3 class="slds-text-heading_small font-bold">
                                🛡️ Active Safety Protections in This Org
                            </h3>
                            <p class="slds-text-body_regular slds-text-color_weak slds-m-top_xx-small">
                                These rules automatically protect your agents against runaway loops, database crashes, and timeouts.
                            </p>
                        </div>

                        <!-- Clean Card List for Rules -->
                        <div class="slds-grid slds-wrap slds-gutters">
                            <template for:each={rules} for:item="r">
                                <div key={r.label} class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_medium">
                                    <div class="slds-box slds-box_small slds-theme_default rule-card">
                                        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                            <div class="slds-col slds-grow">
                                                <span class="font-bold rule-name">{r.label}</span>
                                            </div>
                                            <div class="slds-col slds-no-flex">
                                                <template if:true={r.isActive}>
                                                    <span class="slds-badge slds-theme_success font-bold">ACTIVE</span>
                                                </template>
                                                <template if:false={r.isActive}>
                                                    <span class="slds-badge slds-badge_lightest">INACTIVE</span>
                                                </template>
                                            </div>
                                        </div>
                                        <div class="slds-text-body_small slds-m-bottom_xx-small">
                                            <b>Applies To:</b> <code>{r.actionName}</code>
                                        </div>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            {r.errorMessage}
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div class="slds-box slds-theme_shade slds-m-top_small slds-p-around_small">
                            <div class="slds-text-body_small slds-text-color_weak">
                                💡 To customize these rules, navigate to <b>Setup → Custom Code → Custom Metadata Types → Agent Chaos Rule</b>.
                            </div>
                        </div>
                    </div>
                </lightning-tab>

            </lightning-tabset>

            <!-- Clean Footer -->
            <div class="slds-m-top_medium slds-p-top_small slds-border_top slds-text-align_center slds-text-color_weak slds-text-body_small">
                Agentforce Safety Studio • 100% Native Salesforce • 0 Flex Credits Consumed
            </div>
        </div>
    </lightning-card>
</template>
